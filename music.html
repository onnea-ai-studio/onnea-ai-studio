
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONNEA MUSIC AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: linear-gradient(135deg, #09051a, #160b35, #241052);
  color: white;
  min-height: 100vh;
}

.container {
  width: 100%;
  max-width: 700px;
  margin: auto;
  padding: 24px 18px 50px;
}

.header {
  text-align: center;
  margin-bottom: 25px;
}

.logo {
  font-size: 30px;
  font-weight: 800;
  letter-spacing: 2px;
}

.subtitle {
  margin-top: 8px;
  color: #d8cfff;
  font-size: 14px;
}

.card {
  background: rgba(255,255,255,0.09);
  border: 1px solid rgba(255,255,255,0.16);
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 18px;
  backdrop-filter: blur(12px);
}

h2 {
  margin-top: 0;
  font-size: 20px;
}

label {
  display: block;
  margin: 15px 0 7px;
  font-size: 14px;
  color: #e9e2ff;
}

input[type="file"],
select,
textarea {
  width: 100%;
  border: none;
  border-radius: 12px;
  padding: 13px;
  background: rgba(255,255,255,0.12);
  color: white;
  font-size: 15px;
}

select option {
  color: black;
}

textarea {
  min-height: 180px;
  resize: vertical;
}

.file-note {
  margin-top: 8px;
  font-size: 12px;
  color: #bdb4d8;
  line-height: 1.5;
}

.button {
  width: 100%;
  border: none;
  border-radius: 14px;
  padding: 16px;
  margin-top: 18px;
  font-size: 17px;
  font-weight: 700;
  color: white;
  background: linear-gradient(90deg, #8d5cff, #c45cff);
  cursor: pointer;
}

.button:active {
  transform: scale(0.98);
}

.status {
  margin-top: 15px;
  padding: 12px;
  border-radius: 12px;
  background: rgba(0,0,0,0.22);
  font-size: 13px;
  line-height: 1.5;
  display: none;
}

audio {
  width: 100%;
  margin-top: 15px;
}

.back {
  display: block;
  text-align: center;
  margin-top: 22px;
  color: #d8cfff;
  text-decoration: none;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">ONNEA MUSIC AI</div>
    <div class="subtitle">
      AI 音樂・AI Cover・多語言歌曲・Rap・MV
    </div>
  </div>

  <div class="card">

    <h2>🎵 AI Cover</h2>

    <label>① 上傳原曲母版</label>

    <input
      id="audioFile"
      type="file"
      accept=".mp3,.wav,.m4a,.mp4,.mov,audio/*,video/*"
    >

    <div class="file-note">
      支援 MP3、WAV、M4A、MP4、MOV。<br>
      你可以直接使用《人、放大字幕版(2).mp4》作為母版。
    </div>

    <label>② Cover 語言</label>

    <select id="language">
      <option value="taiwanese">台灣台語</option>
      <option value="mandarin">國語</option>
      <option value="english">English</option>
      <option value="korean">한국어</option>
      <option value="japanese">日本語</option>
    </select>

    <label>③ Cover 歌詞</label>

    <textarea
      id="lyrics"
      placeholder="請貼上已經鎖定的台語版歌詞……"
    ></textarea>

    <label>④ 人聲設定</label>

    <select id="voice">
      <option value="female">女聲</option>
      <option value="male">男聲</option>
    </select>

    <label>⑤ Cover 模式</label>

    <select id="mode">
      <option value="preserve">最大程度保留原曲旋律與節奏</option>
      <option value="creative">保留原曲結構，增加演唱變化</option>
    </select>

    <button class="button" onclick="generateCover()">
      🎤 開始製作 AI Cover
    </button>

    <div id="status" class="status"></div>

    <div id="result" style="display:none;">
      <h3>🎧 Cover 結果</h3>
      <audio id="resultAudio" controls></audio>
    </div>

  </div>

  <a class="back" href="index.html">
    ← 返回 ONNEA AI STUDIO
  </a>

</div>

<script>

const API_ENDPOINT = "/api/cover";

function showStatus(message) {
  const status = document.getElementById("status");
  status.style.display = "block";
  status.innerText = message;
}

async function generateCover() {

  const fileInput = document.getElementById("audioFile");
  const lyrics = document.getElementById("lyrics").value.trim();
  const language = document.getElementById("language").value;
  const voice = document.getElementById("voice").value;
  const mode = document.getElementById("mode").value;

  if (!fileInput.files.length) {
    showStatus("⚠️ 請先上傳原曲母版音檔。");
    return;
  }

  if (!lyrics) {
    showStatus("⚠️ 請先貼上 Cover 歌詞。");
    return;
  }

  const file = fileInput.files[0];

  showStatus("⏳ 正在準備上傳母版與 Cover 設定……");

  const formData = new FormData();

  formData.append("audio", file);
  formData.append("lyrics", lyrics);
  formData.append("language", language);
  formData.append("voice", voice);
  formData.append("mode", mode);

  try {

    const response = await fetch(API_ENDPOINT, {
      method: "POST",
      body: formData
    });

    if (!response.ok) {
      throw new Error("API 尚未連接或生成失敗");
    }

    const data = await response.json();

    if (data.audio_url) {

      document.getElementById("result").style.display = "block";

      document.getElementById("resultAudio").src =
        data.audio_url;

      showStatus("✅ AI Cover 生成完成！");

    } else {

      showStatus(
        "⚠️ AI 後端已回應，但沒有收到音檔結果。"
      );

    }

  } catch (error) {

    showStatus(
      "目前 AI GPU 後端尚未連接。下一步我們會把真正的 ACE-Step AI Cover 引擎接到這個按鈕。"
    );

  }

}

</script>

</body>
</html>
