<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onnea AI StudioTEST</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #09001f, #18004a, #3b146f);
      color: white;
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 40px 20px;
      text-align: center;
    }

    .logo {
      font-size: 42px;
      font-weight: bold;
      letter-spacing: 5px;
      margin-top: 30px;
    }

    .subtitle {
      margin-top: 12px;
      font-size: 18px;
      opacity: 0.85;
    }

    .tagline {
      margin: 20px auto 45px;
      font-size: 16px;
      opacity: 0.7;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
      max-width: 850px;
      margin: auto;
    }

    .card {
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.20);
      border-radius: 24px;
      padding: 40px 25px;
      backdrop-filter: blur(12px);
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-6px);
      background: rgba(255,255,255,0.16);
    }

    .icon {
      font-size: 55px;
      margin-bottom: 20px;
    }

    h2 {
      font-size: 27px;
      margin-bottom: 12px;
    }

    .description {
      line-height: 1.7;
      opacity: 0.8;
      margin-bottom: 25px;
    }

    button {
      border: none;
      border-radius: 30px;
      padding: 13px 28px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: white;
      color: #26004f;
    }

    .membership {
      margin-top: 55px;
      padding: 25px;
      border-radius: 20px;
      background: rgba(255,255,255,0.08);
    }

    .membership strong {
      font-size: 25px;
    }

    footer {
      margin-top: 50px;
      opacity: 0.5;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">ONNEA</div>

    <div class="subtitle">AI STUDIO</div>

    <div class="tagline">
      Create Music. Create Stories. Create Your World.
    </div>

    <div class="cards">

      <div class="card">
        <div class="icon">🎵</div>
        <h2>MUSIC AI</h2>
        <p class="description">
          AI 音樂、歌詞、Rap、多語言歌曲、舞蹈與 MV 創作。
        </p>
        <button onclick="alert('MUSIC AI 即將開放')">
          開始創作
        </button>
      </div>

      <div class="card">
        <div class="icon">🎬</div>
        <h2>STORY AI</h2>
        <p class="description">
          從故事、劇本到人物、場景、配音與影片的 AI 創作。
        </p>
        <button onclick="alert('STORY AI 即將開放')">
          開始創作
        </button>
      </div>

    </div>

    <div class="membership">
      <strong>ONNEA CREATOR</strong>
      <p style="margin-top:10px;">
        一個平台，讓你的音樂與故事自由創作。
      </p>
    </div>

    <footer>
      © 2026 Onnea LightVerse · Onnea AI Studio
    </footer>

  </div>

</body>
</html>
